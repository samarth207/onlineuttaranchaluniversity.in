<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquire Now | Online Uttaranchal University</title>
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
    <link rel="stylesheet" href="assets/css/index.css">
    <style>
        body { background: #f4f6fb; display: flex; flex-direction: column; min-height: 100vh; }
        .lead-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 16px; }
        .lead-card {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 24px rgba(6,66,144,.10);
            padding: 40px 36px;
            width: 100%;
            max-width: 480px;
        }
        .lead-card h1 { font-size: 1.5rem; color: #064290; margin-bottom: 4px; }
        .lead-card p  { color: #555; font-size: .95rem; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: .85rem; font-weight: 600; color: #333; margin-bottom: 5px; }
        .form-group input,
        .form-group select {
            width: 100%; padding: 10px 14px; border: 1px solid #cdd5e0;
            border-radius: 8px; font-size: .95rem; outline: none;
            transition: border-color .2s;
        }
        .form-group input:focus,
        .form-group select:focus { border-color: #064290; }
        .phone-row { display: flex; gap: 8px; }
        .phone-row select { width: 90px; flex-shrink: 0; }
        .phone-row input  { flex: 1; }
        .submit-btn {
            width: 100%; padding: 12px; background: #064290; color: #fff;
            border: none; border-radius: 8px; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: background .2s; margin-top: 6px;
        }
        .submit-btn:hover { background: #0a5bbf; }
        .submit-btn:disabled { background: #8aabcf; cursor: not-allowed; }
        #form-msg { margin-top: 14px; padding: 10px 14px; border-radius: 8px; font-size: .9rem; display: none; }
        #form-msg.success { background: #e6f9ee; color: #1a7a3c; }
        #form-msg.error   { background: #fdecea; color: #b91c1c; }
        .required { color: #c9001a; }
    </style>
</head>
<body>

    <div class="lead-wrap">
        <div class="lead-card">
            <h1>Enquire Now</h1>
            <p>Fill in your details and our admissions team will get back to you shortly.</p>

            <form id="leadForm" novalidate>
                <div class="form-group">
                    <label for="name">Full Name <span class="required">*</span></label>
                    <input type="text" id="name" name="name" placeholder="Your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number <span class="required">*</span></label>
                    <div class="phone-row">
                        <select id="countryCode" name="countryCode">
                            <option value="+91" selected>🇮🇳 +91</option>
                            <option value="+1">🇺🇸 +1</option>
                            <option value="+44">🇬🇧 +44</option>
                            <option value="+971">🇦🇪 +971</option>
                            <option value="+61">🇦🇺 +61</option>
                            <option value="+65">🇸🇬 +65</option>
                        </select>
                        <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="course">Program Interested In <span class="required">*</span></label>
                    <select id="course" name="course" required>
                        <option value="">-- Select Program --</option>
                        <option value="MBA">Master of Business Administration (MBA)</option>
                        <option value="MCA">Master of Computer Applications (MCA)</option>
                        <option value="Executive MBA">Executive MBA</option>
                        <option value="BBA">Bachelor of Business Administration (BBA)</option>
                        <option value="BCA">Bachelor of Computer Applications (BCA)</option>
                        <option value="BA">Bachelor of Arts (BA)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city" placeholder="Your city">
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Submit Enquiry</button>
                <div id="form-msg"></div>
            </form>
        </div>
    </div>

    <script>
        const form    = document.getElementById('leadForm');
        const btn     = document.getElementById('submitBtn');
        const msg     = document.getElementById('form-msg');

        function showMsg(text, type) {
            msg.textContent = text;
            msg.className   = type;
            msg.style.display = 'block';
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const name        = document.getElementById('name').value.trim();
            const email       = document.getElementById('email').value.trim();
            const mobile      = document.getElementById('mobile').value.trim();
            const course      = document.getElementById('course').value;
            const city        = document.getElementById('city').value.trim();
            const countryCode = document.getElementById('countryCode').value;

            if (!name || name.length < 2) return showMsg('Please enter your full name.', 'error');
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showMsg('Please enter a valid email address.', 'error');
            if (!mobile || !/^[0-9]{7,15}$/.test(mobile)) return showMsg('Please enter a valid mobile number.', 'error');
            if (!course) return showMsg('Please select a program.', 'error');

            btn.disabled    = true;
            btn.textContent = 'Submitting…';
            msg.style.display = 'none';

            try {
                const res  = await fetch('api/submit-lead.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name, email, mobile, course, city,
                        countryCode,
                        source: 'Website - Enquiry Form',
                        page: window.location.href
                    })
                });

                const data = await res.json();

                if (data.Status === 'Success') {
                    showMsg('Thank you! Our team will contact you shortly.', 'success');
                    form.reset();
                } else {
                    showMsg(data.Message || 'Something went wrong. Please try again.', 'error');
                }
            } catch (err) {
                showMsg('Network error. Please try again or call 9266530366.', 'error');
            } finally {
                btn.disabled    = false;
                btn.textContent = 'Submit Enquiry';
            }
        });
    </script>

<div class="fixed-buttons">
    <a href="https://wa.me/919266530366" target="_blank" rel="noopener" class="whatsapp" aria-label="Chat on WhatsApp">&#x1F4AC;</a>
    <a href="tel:9266530366" class="phone" aria-label="Call Helpline">&#x1F4DE;</a>
</div>
</body>
</html>
